<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b14">
<title>RING QUEEN - 여자 프로레슬링 매니저</title>
<style>
:root{
  --bg:#0d0b14; --panel:#1a1626; --panel2:#241d35; --line:#3a2f52;
  --ink:#efe9ff; --dim:#b0a4cc; --pink:#ff4d8d; --gold:#ffc844;
  --cyan:#4de1ff; --green:#5ce07a; --red:#ff5b5b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"D2Coding","Apple SD Gothic Neo",monospace;
  font-size:13px; line-height:1.5; overscroll-behavior:none;
}
canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges}
.sprite{display:block;margin:0 auto;overflow:hidden;position:relative}
.sprite .spin{position:absolute;inset:0;display:block;background-repeat:no-repeat;background-image:var(--atlas);
  transition:transform .32s ease,filter .32s ease}
.flip{transform:scaleX(-1)}
.fighters .flip.lunge-r{transform:scaleX(-1) translateX(10px)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{max-width:440px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden}

/* ===== 공통 픽셀 패널 ===== */
.pnl{background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 #000;padding:10px;margin-bottom:10px}
.pnl.alt{background:var(--panel2)}
.ttl{font-size:11px;letter-spacing:1px;color:var(--pink);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ttl b{color:var(--ink)}
.dim{color:var(--dim)}
.gold{color:var(--gold)} .cy{color:var(--cyan)} .gr{color:var(--green)} .rd{color:var(--red)} .pk{color:var(--pink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font-size:11px}
.tiny{font-size:10px;letter-spacing:.5px}
.center{text-align:center}
hr.px{border:none;border-top:2px dashed var(--line);margin:8px 0}

/* ===== 버튼 ===== */
.btn{display:block;width:100%;min-height:46px;padding:10px;background:var(--panel2);
  border:2px solid var(--line);box-shadow:3px 3px 0 #000;text-align:center;letter-spacing:1px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.pri{background:var(--pink);color:#1a0a14;border-color:#ff9cc2;font-weight:bold}
.btn.sec{background:var(--panel2)}
.btn.sm{min-height:38px;font-size:11px;padding:6px}
.btn[disabled]{opacity:.4}
.btns{display:grid;gap:8px}
.btns.g2{grid-template-columns:1fr 1fr}
.btns.g3{grid-template-columns:1fr 1fr 1fr}

/* ===== 상단 상태바 ===== */
header{position:sticky;top:0;z-index:20;background:#120f1c;border-bottom:2px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}
.hbar{display:flex;gap:6px;align-items:center;justify-content:space-between}
.hname{font-size:12px;letter-spacing:1px}
.hstat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:10px}
.hstat div{background:var(--panel);border:1px solid var(--line);padding:3px 4px;text-align:center}
.hstat span{display:block;color:var(--dim);font-size:9px}
.tipbtn{width:34px;height:30px;border:2px solid var(--line);background:var(--panel);font-size:14px;line-height:1;box-shadow:2px 2px 0 #000}
.tipbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}

/* ===== 본문/탭 ===== */
main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px;padding-bottom:80px;-webkit-overflow-scrolling:touch}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;max-width:440px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);background:#120f1c;border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:8px 2px 6px;font-size:9px;color:var(--dim);letter-spacing:0}
nav button .ic{display:block;font-size:16px;line-height:1.2}
nav button.on{color:var(--pink);background:#1d1530}
nav:empty,header:empty{display:none}

/* ===== 게이지 ===== */
.bar{height:8px;background:#0a0810;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink)}
.bar.c i{background:var(--cyan)} .bar.g i{background:var(--green)} .bar.o i{background:var(--gold)}
.attr{margin-bottom:6px}
.attr .row{font-size:11px;margin-bottom:2px}
.pot{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.9}

/* ===== 스프라이트 ===== */
.sprite{display:block;margin:0 auto}
.card{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px;margin-bottom:6px}
.card canvas{flex:none}
.card .info{flex:1;min-width:0}
.card .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;border:1px solid var(--line);padding:0 4px;font-size:9px;margin-right:3px;background:#0f0c18}
.badge.t{border-color:var(--gold);color:var(--gold)}
.badge.p{border-color:var(--pink);color:var(--pink)}

/* ===== 모달 ===== */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,3,10,.88);display:none;
  align-items:center;justify-content:center;padding:12px;
  padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
#modal.on{display:flex}
.mbox{width:100%;max-width:416px;max-height:100%;overflow-y:auto;background:var(--panel);
  border:2px solid var(--pink);box-shadow:4px 4px 0 #000;padding:12px}
.mtitle{font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;text-align:center}

/* ===== 경기 화면 ===== */
.ring{position:relative;height:176px;background:linear-gradient(#2a1f3d,#191230);
  border:2px solid var(--line);overflow:hidden;margin-bottom:8px}
.ropes{position:absolute;left:0;right:0;height:2px;background:var(--pink);opacity:.55}
.mat{position:absolute;left:0;right:0;bottom:0;height:52px;background:#3a2b55;border-top:2px solid #56407e}
.fighters{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:10px}
.fighters canvas{transition:transform .18s steps(2)}
.lunge-l{transform:translateX(10px)} .lunge-r{transform:translateX(-10px)}
.mlog{height:150px;overflow-y:auto;background:#0a0810;border:2px solid var(--line);padding:8px;font-size:11px}
.mlog p{margin-bottom:4px}
.mlog .hit{color:var(--ink)} .mlog .big{color:var(--gold)} .mlog .sys{color:var(--dim)}
.mlog .near{color:#ffe487;font-weight:bold} .mlog .counter{color:var(--cyan)}
.mlog .crowd{color:var(--pink)} .mlog .brawl{color:#ffa45c}
.mlog .runin{color:var(--red);font-weight:bold}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}}
.ring.shake{animation:shk .3s steps(2)}
.ring.flash{animation:shk .3s steps(2);box-shadow:inset 0 0 0 999px rgba(255,91,91,.22)}
.hpwrap{display:flex;gap:6px;margin-bottom:6px;font-size:10px}
.hpwrap>div{flex:1}
.stars{font-size:16px;color:var(--gold);letter-spacing:2px}

/* ===== 선택지 ===== */
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);
  padding:7px 9px;margin-bottom:6px;box-shadow:2px 2px 0 #000;min-height:44px}
.opt:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
.opt b{color:var(--cyan);display:block;font-size:12px}
.opt span{font-size:10px;color:var(--dim)}
.opt.on{border-color:var(--pink);background:#31203f}

/* ===== 타이틀 화면 ===== */
.logo{text-align:center;padding:16px 0 8px}
.logo h1{font-size:26px;letter-spacing:3px;color:var(--pink);text-shadow:3px 3px 0 #000,0 0 12px rgba(255,77,141,.5)}
.logo h2{font-size:11px;letter-spacing:4px;color:var(--gold);margin-top:4px}
.newsline{border-left:3px solid var(--line);padding:2px 0 2px 7px;margin-bottom:6px;font-size:11px}
.newsline.hot{border-color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:6px;text-align:center}
.stat b{display:block;font-size:15px;color:var(--gold)}
.stat span{font-size:9px;color:var(--dim)}
.scroll-x{overflow-x:auto}
input[type=text]{width:100%;background:#0a0810;border:2px solid var(--line);color:var(--ink);
  padding:9px;font:inherit;font-size:13px;min-height:44px}
input[type=text]:focus{outline:none;border-color:var(--pink)}
.swatch{display:flex;gap:6px;flex-wrap:wrap}
.swatch button{width:34px;height:34px;border:2px solid var(--line);box-shadow:2px 2px 0 #000}
.swatch button.on{border-color:var(--ink);transform:translateY(-2px)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.pcard{background:var(--panel2);border:2px solid var(--line);padding:3px;box-shadow:2px 2px 0 #000}
.pcard.on{border-color:var(--pink);background:#31203f}
.pcard{position:relative}
.fbadge{position:absolute;left:3px;bottom:3px;background:rgba(255,77,141,.92);color:#1a0a14;font-size:8px;padding:1px 3px;letter-spacing:0}
.pcard .sprite{width:100%!important;height:auto!important;aspect-ratio:3/4}
.pwrap{max-height:296px;overflow-y:auto;border:2px solid var(--line);background:#0d0b16;padding:5px;margin:8px 0}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<body>
<div id="app">
  <header id="hd"></header>
  <main id="mn"></main>
  <nav id="nv"></nav>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
/* ==========================================================
   RING QUEEN - 여자 프로레슬링 매니저 (단일 파일)
   ========================================================== */
"use strict";

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri  = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 캐릭터 아트 ----------
   65종 포트레이트를 단일 WebP 아틀라스(11x6)로 내장하고 background-position으로 잘라 쓴다.
   data URI가 DOM에 복제되지 않으므로 65종 그리드도 가볍다. */
const NPORT = 122, ACOL = 12, AROW = 11;
const TONES = [
  { n: '원본',     f: '' },
  { n: '웜',       f: 'hue-rotate(14deg) saturate(1.1)' },
  { n: '쿨',       f: 'hue-rotate(-14deg) saturate(1.05)' },
  { n: '앰버',     f: 'hue-rotate(26deg) saturate(1.15) brightness(1.05)' },
  { n: '시안',     f: 'hue-rotate(-26deg) saturate(1.1)' },
  { n: '바이올렛', f: 'hue-rotate(40deg) saturate(1.1)' },
  { n: '느와르',   f: 'saturate(.35) contrast(1.15)' },
  { n: '하이콘',   f: 'saturate(1.5) contrast(1.15)' }
];
const PRESETS = NPORT * TONES.length;        // 520가지 조합

function portraitIdx(look) {
  if (look.p !== undefined) return look.p % NPORT;
  return ((look.hair || 0) * 7 + (look.oc || 0)) % NPORT;     // 구버전 세이브 호환
}
function toneIdx(look) {
  if (look.t !== undefined) return look.t % TONES.length;
  const h = look.hue || 0;                                    // 구버전 hue -> 톤
  return h === 0 ? 0 : h === 14 ? 1 : h === -14 ? 2 : h === 26 ? 3 : h === -26 ? 4 : 5;
}
/* 상황별 표정 연출: 얼굴 클로즈업 배율 + 감정 필터 */
const MOODS = {
  neutral: { f: '',                                            z: 1,    o: '50% 30%' },
  focus:   { f: 'contrast(1.12) saturate(.95)',                z: 1.18, o: '50% 24%' },
  fierce:  { f: 'contrast(1.26) saturate(1.15)',               z: 1.34, o: '50% 20%' },
  rage:    { f: 'contrast(1.3) saturate(1.45) hue-rotate(8deg)', z: 1.46, o: '50% 18%' },
  pain:    { f: 'saturate(.42) brightness(.78) contrast(1.1)', z: 1.3,  o: '50% 20%' },
  down:    { f: 'saturate(.5) brightness(.72) hue-rotate(-16deg)', z: 1.12, o: '50% 26%' },
  joy:     { f: 'brightness(1.14) saturate(1.25)',             z: 1.22, o: '50% 22%' },
  proud:   { f: 'brightness(1.08) saturate(1.18) contrast(1.08)', z: 1.14, o: '50% 24%' },
  calm:    { f: 'saturate(.85) brightness(1.02)',              z: 1.04, o: '50% 28%' },
  sepia:   { f: 'sepia(.5) contrast(1.05)',                    z: 1.06, o: '50% 28%' }
};
function mixF(a, b) { const v = [a, b].filter(x => x).join(' '); return v || 'none'; }

/* 선별 캐릭터의 실제 표정 컷 (없으면 무드 연출로 폴백) */
const FCOL = 7, FROW = 3;
const FACEMAP = {"67": {"rage": 1, "fierce": 2}, "70": {"rage": 3, "fierce": 4}, "77": {"pain": 5}, "81": {"joy": 7, "pain": 8, "down": 9}, "89": {"rage": 10, "fierce": 11}, "65": {"joy": 12, "proud": 13}, "66": {"joy": 14}, "69": {"joy": 15}, "76": {"joy": 16, "proud": 17}, "87": {"joy": 18, "proud": 19}};
function faceTile(look, mood) {
  const m = FACEMAP[portraitIdx(look)];
  return (m && mood && m[mood] !== undefined) ? m[mood] : -1;
}
/* 포트레이트/표정 공통 타일 스타일 */
function tileStyle(look, mood) {
  const ft = faceTile(look, mood);
  if (ft >= 0) {
    const c = ft % FCOL, r = (ft / FCOL) | 0;
    return { bg: 'var(--faces)', sz: (FCOL * 100) + '% ' + (FROW * 100) + '%',
      pos: (c / (FCOL - 1) * 100).toFixed(3) + '% ' + (r / (FROW - 1) * 100).toFixed(3) + '%',
      tr: 'scale(1.02)', or: '50% 34%', f: mixF(TONES[toneIdx(look)].f, '') };
  }
  const i = portraitIdx(look), c = i % ACOL, r = (i / ACOL) | 0;

function makeAI(brand, tier, style) {
  style = style || pick(Object.keys(STYLES));
  const base = STYLES[style].base;
  const attr = {}, pot = {};
  ATTRS.forEach(a => {
    attr[a.k] = cl(Math.round(base[a.k] + tier * 1.7 + rnd(-2, 2)), 3, 20);
    pot[a.k] = cl(attr[a.k] + ri(0, 4), 3, 20);
  });
  const useNick = Math.random() < .4;
  return {
    id: uid++, ai: true, brand: brand, style: style,
    name: (useNick ? pick(NICK) + ' ' : '') + pick(F_NAMES) + ' ' + pick(L_NAMES),
    align: Math.random() < .5 ? 'face' : 'heel',
    look: randLook(), age: ri(21, 34), attr: attr, pot: pot,
    pop: cl(Math.round(tier * 11 + rnd(-8, 8)), 5, 95), home: cl(Math.round(tier * 11), 5, 92),
    push: cl(Math.round(tier * 0.9 + rnd(-.5, .8)), 1, 5),
    rec: { w: ri(0, 40), l: ri(0, 40) }
  };
}
function genRoster() {
  const r = [], used = {}, ks = Object.keys(STYLES);
  for (let i = 0; i < 18; i++) {
    const next = i < 8;
    let w, guard = 0;
    do { w = makeAI(next ? 'next' : 'main', next ? ri(1, 4) : ri(3, 7), ks[i % ks.length]); } while (used[w.name] && ++guard < 40);
    used[w.name] = 1; r.push(w);
  }
  const pool = [];
  for (let i = 0; i < NPORT; i++) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) { const j = ri(0, i); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  r.forEach((w, i) => w.look = { p: pool[i % pool.length], t: ri(0, TONES.length - 1) });
  return r;
}
function findW(id) { return id === P.id ? P : S.roster.find(w => w.id === id); }
function brandPool(b) { return S.roster.filter(w => w.brand === b); }

/* 순위: 인지도 + 푸시 + 승수 */
function score(w) { return w.pop * 1 + pushLv(w) * 5 + w.rec.w * .3; }
function rankList(brand) {
  const l = brandPool(brand).slice();
  if (P.brand === brand) l.push(P);
  return l.sort((a, b) => score(b) - score(a));
}
function rankOf(w) { return rankList(w.brand).findIndex(x => x.id === w.id) + 1; }

/* 푸시 등급 1(자버)~5(메인이벤터) */
function pushLv(w) {
  if (w.ai) return w.push;
  let p = 1 + (w.pop >= 25) + (w.pop >= 45) + (w.pop >= 65) + (w.pop >= 82);
  if (S.trust < 30) p -= 1;
  if (S.trust > 78) p += 1;
  if (holdsAny()) p += 1;
  return cl(p, 1, 5);
}

function ageFactor(a) { return a <= 21 ? 1.25 : a <= 25 ? 1.1 : a <= 29 ? 1 : a <= 32 ? .8 : a <= 35 ? .6 : .45; }
function needXp(v) { return 8 + v * 1.7; }
function gainXp(key, amount) {
  const lines = [];
  P.xp[key] += amount;
  while (P.xp[key] >= needXp(P.attr[key])) {
    if (P.attr[key] >= P.pot[key]) { P.xp[key] = needXp(P.attr[key]) * .98; break; }
    P.xp[key] -= needXp(P.attr[key]);
    P.attr[key]++;
    lines.push('<b class="gr">▲ ' + ATTRS.find(a => a.k === key).n + ' 상승! → ' + P.attr[key] + '</b>');
  }
  return lines;
}
function trainWeek(key) {
  const g = STYLES[P.style].gro[key];
  const cf = .55 + P.cond / 220;
  let amt = (2.4 + rnd(0, 1.8)) * g * ageFactor(P.age) * cf;
  if (S.gymWeeks > 0) { amt *= 1.75; S.gymWeeks--; }
  const lines = ['<span class="dim">' + ATTRS.find(a => a.k === key).n + ' 집중 훈련 (+' + r1(amt) + ' XP)</span>'];
  if (P.attr[key] >= P.pot[key]) lines.push('<span class="dim">이미 잠재치 한계. 성장이 없습니다.</span>');
  lines.push(...gainXp(key, amt));
  P.cond = cl(P.cond - ri(9, 14), 0, 100);
  return lines;
}

function doActivity() {
  const a = S.act || { k: 'rest' };

    return [flavorLine('rest'), '<span class="rd">부상 중에는 재활만 가능합니다.</span>', ...doRest(true)];
  }
  if (a.k === 'train') return [flavorLine('train'), ...trainWeek(a.attr)];
  if (a.k === 'rest') return [flavorLine('rest'), ...doRest(false)];

  return [fl, '광고·행사 출연. 자금 +$' + m];
}
function doRest(auto) {
  const heal = ri(26, 38);
  P.cond = cl(P.cond + heal, 0, 100);
  const l = ['<span class="cy">' + (auto ? '재활' : '휴식') + ' - 컨디션 +' + heal + '</span>'];
  if (P.injury > 0) { P.injury = Math.max(0, P.injury - (Math.random() < .35 ? 2 : 1)); l.push('<span class="dim">부상 잔여 ' + P.injury + '주</span>'); }
  return l;
}

/* ==========================================================
   경기 시뮬레이션
   ========================================================== */
function pushScore(w) {
  let s = w.pop * .6 + pushLv(w) * 8;
  if (!w.ai && holdsAny()) s += 12;
  if (w.ai && (S.titles.rising === w.id || S.titles.world === w.id)) s += 12;
  return s;
}
function perf(w) {
  const a = w.attr;
  return (a.tech * 1.4 + a.sell * 1.6 + a.aerial * .8 + a.power * .7 + a.cha * 1.1) / 5.6;
}
/* ---------- 경기 연출 텍스트 ---------- */
const GRAP = ['락업에서 힘겨루기', '헤드락으로 조인다', '암 드래그로 매트에 눕힌다', '와키가타메로 팔을 꺾는다',
  '숄더 태클로 밀어붙인다', '드롭 토 홀드로 균형을 무너뜨린다', '리스트 락으로 관절을 비튼다'];
const CROWD = ['관중석에서 "이 경기다!" 챈트가 터진다.', '"한 판 더!" 함성이 아레나를 흔든다.',
  '양쪽 응원이 정면으로 부딪힌다. 아레나가 두 쪽으로 갈렸다.', '기립한 관중이 카메라 플래시를 터뜨린다.',
  '해설석: "이건… 오늘 밤 최고의 경기가 될지도 모릅니다."'];
const TAUNT = ['{W} 관중을 향해 손가락을 치켜든다.', '{W} 상대를 도발하며 코너에 기대선다.',
  '{W} 쓰러진 상대 위에 발을 올리고 포즈를 잡는다.'];

/* 받침 유무로 조사 선택: J('스톰','이','가') -> '스톰이' */
function J(w, a, b) {
  const c = String(w).charCodeAt(String(w).length - 1);
  const jong = (c >= 0xAC00 && c <= 0xD7A3) ? ((c - 0xAC00) % 28) !== 0 : false;
  return w + (jong ? a : b);
}
function mv(w) { return pick(MOVES[w.style].concat(MOVES.all)); }
function fill(t, a, b) { return t.replace(/\{W\}/g, J(a.name, '이', '가')).replace(/\{L\}/g, b ? b.name : ''); }

/* 경기 전개 생성: 페이즈 구조 + 하이라이트 모먼트 + 난입 */
function buildMatch(opp, ctx, win, hiRate) {
  const log = [], hi = { near: 0, counter: 0, dive: 0, brawl: 0 };
  let runin = null, mo = 0;
  const A = P, B = opp;
  const act = () => { const me = Math.random() < .5 + mo * .06; mo = cl(mo + (me ? 1 : -1), -3, 3); return me; };

  log.push({ t: 'sys', s: (ctx.ppv ? '메인 이벤트' : '위클리 메인') + ' — ' + A.name + ' vs ' + B.name });
  log.push({ t: 'sys', s: '공이 울렸다!' });

  /* 초반: 그래플링 탐색 */
  for (let i = 0; i < ri(2, 3); i++) {
    const me = act(), w = me ? A : B;
    log.push({ t: 'hit', me: me, s: J(w.name, '이', '가') + ' ' + pick(GRAP) + '.' });
  }
  log.push({ t: 'crowd', s: '탐색전이 끝났다. 관중의 박수가 잦아든다.' });

  /* 중반: 기술 공방 + 하이라이트 */
  const mids = ri(4, 6);
  for (let i = 0; i < mids; i++) {
    const me = act(), w = me ? A : B, l = me ? B : A;
    const roll = Math.random();
    if (roll < hiRate * .42) {
      hi.counter++;
      log.push({ t: 'counter', me: !me, s: J(w.name, '이', '가') + ' ' + mv(w) + '를 노렸지만 — ' + J(l.name, '이', '가') + ' 받아넘긴다! 완벽한 카운터!' });
      mo = cl(mo + (me ? -2 : 2), -3, 3);
    } else if (roll < hiRate * .62) {
      hi.dive++;
      if (Math.random() < .68) log.push({ t: 'big', me: me, s: J(w.name, '이', '가') + ' 탑로프에 오른다… ' + mv(w) + ' 명중!! 아레나가 폭발한다!' });
      else { log.push({ t: 'counter', me: !me, s: w.name + '의 하이 리스크 무브 — 빗나갔다! 매트에 그대로 꽂힌다!' }); mo = cl(mo + (me ? -2 : 2), -3, 3); }
    } else if (roll < hiRate * .72) {
      hi.brawl++;
      log.push({ t: 'brawl', me: me, s: '난투가 링 밖으로 번졌다! ' + J(w.name, '이', '가') + ' ' + J(l.name, '을', '를') + ' 철제 계단에 내던진다. 카운트 시작!' });
    } else {
      const big = Math.random() < .25;
      log.push({ t: big ? 'big' : 'hit', me: me, s: w.name + (big ? ' 회심의 ' : '의 ') + mv(w) + '!' + (big ? ' 매트가 울린다!' : '') });
    }
    if (i === 2) log.push({ t: 'crowd', s: pick(CROWD) });
  }

  /* 난입 */
  const feudOpp = S.feud ? findW(S.feud.oppId) : null;
  if (ctx.runin) {
    runin = ctx.runin;
    log.push({ t: 'runin', s: '★ 난입! ' + J(runin.who, '이', '가') + ' 링사이드로 뛰어들었다!' });
    log.push({ t: 'runin', s: runin.text });
  }

  /* 후반: 니어폴 공방 */
  const nears = ri(1, 2) + (hiRate > .5 ? 1 : 0);
  for (let i = 0; i < nears; i++) {
    const me = act(), w = me ? A : B, l = me ? B : A;
    hi.near++;
    log.push({ t: 'big', me: me, s: w.name + '의 ' + mv(w) + '! 커버!' });
    log.push({ t: 'near', me: me, s: '1… 2… ' + (i === nears - 1 ? '2.9! ' : '') + l.name + ' 킥아웃!! 관중 전원 기립!' });
  }
  if (Math.random() < .5) log.push({ t: 'crowd', s: fill(pick(TAUNT), mo >= 0 ? A : B) });

  /* 피니시 */
  if (ctx.noContest) {
    log.push({ t: 'runin', s: '링이 아수라장이 됐다. 심판이 경기를 중단시킨다.' });
    log.push({ t: 'sys', s: '판정: 노 콘테스트 (무효 경기)' });
  } else {
    const winner = win ? A : B, loser = win ? B : A;
    const fin = pick(FINISH[winner.style]);
    if (Math.random() < .45) log.push({ t: 'counter', s: J(loser.name, '이', '가') + ' 피니셔를 시도 — ' + J(winner.name, '이', '가') + ' 빠져나온다!' });
    log.push({ t: 'big', me: win, s: winner.name + ', 피니셔 ' + fin + '!!' });
    log.push({ t: 'near', me: win, s: '1… 2… 3!!' });
    log.push({ t: 'sys', s: '승자: ' + winner.name });
  }
  return { log: log, hi: hi, runin: runin };
}

function simMatch(opp, ctx) {
  /* 1) 부커가 승자를 정한다 (능력치가 아니라 푸시/스토리) */
  let pw = 1 / (1 + Math.exp(-(pushScore(P) - pushScore(opp)) / 15));
  if (ctx.title && !holds(ctx.title)) pw *= .75;
  if (ctx.job) pw = .03;
  if (S.feud && S.feud.oppId === opp.id && ctx.blowoff) pw = cl(pw + S.feud.heat / 260, .05, .95);

  /* 2) 난입 판정 */
  const feudOpp = S.feud ? findW(S.feud.oppId) : null;
  if (feudOpp && feudOpp.id !== opp.id && Math.random() < .16 + S.feud.heat * .0015) {
    ctx.runin = { who: feudOpp.name, kind: 'attack', id: feudOpp.id,
      text: J(feudOpp.name, '이', '가') + ' 심판의 등 뒤에서 ' + J(P.name, '을', '를') + ' 가격한다!' };
    pw *= .25;
  } else if (ctx.title && !holds(ctx.title) && Math.random() < .12) {
    const ch = pick(brandPool(P.brand).filter(w => w.id !== opp.id)) || opp;
    ctx.runin = { who: ch.name, kind: 'chaos', id: ch.id,
      text: J(ch.name, '이', '가') + ' 벨트를 들고 링에 올라 양쪽을 노려본다!' };
    ctx.noContest = Math.random() < .5;
  }
  const win = ctx.noContest ? false : Math.random() < pw;

  /* 3) 하이라이트 발생률 — 양 선수 기량·컨디션·대립 열기가 좌우 */
  const heat = (S.feud && S.feud.oppId === opp.id) ? S.feud.heat : 0;
  const hiRate = cl((perf(P) + perf(opp)) / 40 * .62 + P.cond / 100 * .22 + (ctx.ppv ? .12 : 0) + heat * .002, .12, .85);

  const built = buildMatch(opp, ctx, win, hiRate);
  const hiCount = built.hi.near + built.hi.counter + built.hi.dive + built.hi.brawl;

  /* 4) 경기 평점 — 하이라이트가 실제로 평점을 끌어올린다 */
  let q = perf(P) * .62 + perf(opp) * .38;
  q *= .55 + (P.cond / 100) * .45;
  q += heat * .022;
  if (ctx.ppv) q += 1.1;
  if (ctx.title) q += .8;
  q += P.pop * .012;
  q += hiCount * .34;
  if (ctx.runin) q -= 1.1;                 // 난입은 경기를 흐린다
  q += rnd(-1.1, 1.1);
  const stars = cl(Math.round(q / 3.8 * 2) / 2, .5, 5);

  return { win: win, stars: stars, log: built.log, opp: opp, ctx: ctx,
           hi: built.hi, hiCount: hiCount, runin: built.runin, noContest: !!ctx.noContest };
}

/* 경기 결과를 상태에 반영 */
function applyMatch(res) {
  const lines = [];
  const opp = res.opp, ctx = res.ctx;
  P.st.matches++; P.st.stars += res.stars;
  if (res.stars > P.st.best) P.st.best = res.stars;
  if (ctx.ppv) P.st.ppv++;
  if (ctx.title) P.st.shots++;
  if (res.noContest) lines.push('<span class="rd">난입으로 경기가 무효 처리되었습니다. 전적에 기록되지 않습니다.</span>');
  else if (res.win) { P.rec.w++; opp.rec.l++; } else { P.rec.l++; opp.rec.w++; }
  if (res.hiCount) lines.push('<span class="cy">하이라이트 ' + res.hiCount + '회 — 니어폴 ' + res.hi.near +
    ' · 카운터 ' + res.hi.counter + ' · 하이리스크 ' + res.hi.dive + ' · 장외 ' + res.hi.brawl + '</span>');
  if (res.runin) {
    const rw = findW(res.runin.id);
    if (rw && rw.ai) {
      if (!S.feud || S.feud.oppId !== rw.id) { S.feud = { oppId: rw.id, heat: 35, weeks: 0 }; lines.push('<span class="pk">' + esc(J(rw.name, '과', '와')) + '의 대립이 시작되었습니다.</span>'); }
      else { S.feud.heat = cl(S.feud.heat + ri(18, 28), 0, 100); lines.push('<span class="pk">난입으로 대립 열기가 치솟았습니다. (' + Math.round(S.feud.heat) + ')</span>'); }
    }
    news(res.runin.who + '의 난입으로 ' + P.name + '의 경기가 아수라장이 되었습니다.', true);
  }

  const expPop = 1.8 + P.pop * .018;          // 인지도가 높을수록 팬의 기대치가 높다
  let dp = (res.stars - expPop) * 2.2 * (ctx.ppv ? 1.7 : 1) * (ctx.title ? 1.3 : 1);
  dp += (res.win ? 1.6 : -.4) * (1 - P.pop / 140);
  if (ctx.job) dp = Math.min(dp, .4);
  P.pop = cl(P.pop + dp, 0, 100);

  const expTr = 1.9 + pushLv(P) * .32;        // 푸시가 높을수록 부커의 요구 수준도 높다
  let dt = (res.stars - expTr) * 3.4;
  if (ctx.job) dt += 8;
  S.trust = cl(S.trust + dt, 0, 100);
  lines.push('인지도 ' + (dp >= 0 ? '+' : '') + r1(dp) + ' / 부커 신뢰 ' + (dt >= 0 ? '+' : '') + r1(dt));

  P.cond = cl(P.cond - ri(14, 24) - (ctx.ppv ? 6 : 0), 0, 100);
  lines.push(...gainXp('sell', 1.2 + res.stars * .3));
  lines.push(...gainXp('tech', .7));

  /* 부상 판정 */
  const risk = .015 + (100 - P.cond) / 100 * .09 + (ctx.ppv ? .02 : 0) - P.attr.stam * .002;
  if (Math.random() < risk) {
    P.injury = ri(2, 7);
    P.injName = pick(['무릎 인대 손상', '어깨 탈구', '뇌진탕', '갈비뼈 골절', '발목 염좌']);
    lines.push('<b class="rd">부상! ' + P.injName + ' (' + P.injury + '주 결장)</b>');
    news(P.name + ', ' + P.injName + '으로 ' + P.injury + '주 결장.', true);
  }
  /* 타이틀 이동 */
  if (res.noContest) { /* 무효: 타이틀 이동 없음 */ }
  else if (ctx.title && res.win && !holds(ctx.title)) {
    S.titles[ctx.title] = P.id; P.st.titles++;
    P.st.reigns.push({ t: ctx.title, from: S.week });
    lines.push('<b class="gold">★ ' + TITLES[ctx.title].n + ' 등극! ★</b>');
    news(P.name + ' 선수가 ' + TITLES[ctx.title].n + '에 등극했습니다!', true);
  } else if (ctx.title && !res.win && holds(ctx.title)) {
    S.titles[ctx.title] = opp.id;
    const rg = P.st.reigns[P.st.reigns.length - 1]; if (rg && !rg.to) rg.to = S.week;
    lines.push('<b class="rd">타이틀을 잃었습니다.</b>');
    news(opp.name + ' 선수가 새 ' + TITLES[ctx.title].n + '이 되었습니다.', true);
  }
  /* 라이벌전 종료 */
  if (S.feud && S.feud.oppId === opp.id && ctx.blowoff) {
    lines.push('<span class="pk">' + J(opp.name, '과', '와') + '의 라이벌 구도가 마무리되었습니다.</span>');
    if (res.win) { P.pop = cl(P.pop + 3, 0, 100); lines.push('승리로 구도를 정리하며 인지도 +3'); }
    S.feud = null;
  }
  return lines;
}

/* ==========================================================
   주 진행
   ========================================================== */
const PPV_EVERY = 12;
function isPPV(w) { return w % PPV_EVERY === 0; }
function ppvName(w) { return ['서머 슬래시', '로열 클래시', '아이언 퀸', '파이널 커튼'][(w / PPV_EVERY - 1) % 4]; }

function pickOpponent() {
  const pool = brandPool(P.brand);
  if (!pool.length) return null;
  if (S.feud && Math.random() < .65) { const o = findW(S.feud.oppId); if (o && o.brand === P.brand) return o; }
  const list = rankList(P.brand);
  const myIdx = list.findIndex(w => w.id === P.id);
  const near = list.filter((w, i) => w.ai && Math.abs(i - myIdx) <= 4);
  return near.length ? pick(near) : pick(pool);
}

function advanceWeek() {
  if (S.retired) return;
  S.queue = [];
  const actMood = { train: 'focus', rest: P.injury > 0 ? 'pain' : 'calm', promo: 'proud',
                    back: 'neutral', media: 'joy' }[(S.act || {}).k] || 'neutral';
  const shotMood = P.injury > 0 ? 'pain' : P.cond < 30 ? 'down' : isPPV(S.week) ? 'focus' : S.feud ? 'fierce' : actMood;
  const rep = ['<div class="center" style="margin-bottom:6px">' + spr(P.look, 3, '', '', shotMood) + '</div>']
    .concat(situation(), doActivity());
  S.queue.push({ type: 'report', title: S.week + '주차', lines: rep });

  const ppv = isPPV(S.week);
  if (P.injury > 0) {
    S.queue.push({ type: 'report', title: '결장', lines: ['<span class="rd">' + P.injName + ' 치료 중 - 이번 주 경기 없음 (잔여 ' + P.injury + '주)</span>'] });
    P.pop = cl(P.pop - .8, 0, 100);
  } else {
    /* 라이벌 세그먼트 */
    if (S.feud && !ppv && Math.random() < .7) S.queue.push({ type: 'segment' });
    /* 경기 배정 */
    const chance = ppv ? .95 : .45 + pushLv(P) * .11;
    if (Math.random() < chance) {
      const opp = pickOpponent();
      if (opp) {
        const ctx = { ppv: ppv, title: null, job: false, blowoff: false };
        if (ppv) {
          ctx.name = ppvName(S.week);
          const tk = P.brand === 'main' ? 'world' : 'rising';
          if (titleShotOK()) ctx.title = tk;
          if (ctx.title) { const ch = findW(S.titles[tk]); if (ch && ch.id !== P.id) ctx.oppOverride = ch; }
          if (S.feud) ctx.blowoff = true;
        }
        /* 부커의 잡 지시 */
        if (!ctx.title && !ppv && pushLv(P) <= 3 && Math.random() < .18) ctx.jobOffer = true;
        S.queue.push({ type: 'match', opp: ctx.oppOverride || opp, ctx: ctx });
      }
    } else if (!ppv) {
      S.queue.push({ type: 'report', title: '이번 주 쇼', lines: ['<span class="dim">출전 기회를 얻지 못했습니다. 부커의 눈에 들어야 합니다.</span>'] });
      P.pop = cl(P.pop - .5, 0, 100);
    }
    /* 랜덤 이벤트 */
    if (Math.random() < .34) { const e = rollEvent(); if (e) S.queue.push({ type: 'event', ev: e }); }
  }
  runQueue();
}

function endWeek() {
  /* 수입/지출 */
  S.money += P.salary - (40 + Math.round(P.pop * 2));
  if (P.injury > 0) S.money -= 60;
  P.contract--;
  /* 컨디션 자연 회복 · 인지도 자연 감소(비례) */
  P.cond = cl(P.cond + 6, 0, 100);
  S.trust = cl(S.trust + (50 - S.trust) * .03, 0, 100);
  P.pop = cl(P.pop - (.2 + P.pop * .008), 0, 100);
  if (P.pop > P.st.peak) P.st.peak = P.pop;
  /* 라이벌 진행 */
  if (S.feud) { S.feud.weeks++; if (S.feud.weeks > 14) { S.feud = null; } }
  else if (Math.random() < .07 && P.injury === 0) startFeud();
  /* AI 로스터 변동 */
  S.roster.forEach(w => {
    w.pop = cl(w.pop + (w.home - w.pop) * .06 + rnd(-1.1, 1.1), 3, 98);
    if (Math.random() < .02) { w.rec.w++; } else if (Math.random() < .02) w.rec.l++;
  });
  if (Math.random() < .25) aiTitleNews();
  /* 승격 */
  if (P.brand === 'next' && P.pop >= 58 && S.week > 20) promote();
  /* 계약 */
  if (P.contract <= 0) contractRenew();
  /* 연말 */
  if (S.week % 52 === 0) yearEnd();
  S.week++;
  S.act = null;
  save();
  if (P.age >= 40 && !S.retired && !S.retireAsked) { S.retireAsked = true; openRetire(true); }
}

function aiTitleNews() {
  const tk = Math.random() < .5 ? 'rising' : 'world';
  if (S.titles[tk] === P.id) return;
  const ch = findW(S.titles[tk]);
  const pool = brandPool(TITLES[tk].brand).filter(w => w.id !== ch.id);
  if (!ch || !pool.length) return;
  const ch2 = pick(pool);
  if (Math.random() < .22) {
    S.titles[tk] = ch2.id; ch2.pop = cl(ch2.pop + 6, 0, 98);
    news(J(ch2.name, '이', '가') + ' ' + J(ch.name, '을', '를') + ' 꺾고 새 ' + TITLES[tk].n + '에 등극.', true);
  } else {
    news(ch.name + ', ' + ch2.name + '의 도전을 막고 ' + TITLES[tk].n + ' 방어 성공.');
  }
}
function promote() {
  P.brand = 'main'; P.salary = BRANDS.main.pay;

const BEAT_MS = { near: 950, big: 760, runin: 820, crowd: 620, brawl: 780, counter: 720, sys: 560, hit: 540 };
function queueBeat() {
  if (!MV || MV.i >= MV.res.log.length) { finishPlay(); return; }
  const t = MV.res.log[MV.i].t;
  MV.timer = setTimeout(() => { stepMatch(); queueBeat(); }, BEAT_MS[t] || 560);
}
function stepMatch() {
  const L = MV.res.log;
  if (MV.i >= L.length) { return; }
  const b = L[MV.i++];
  const box = $('#mlog');
  if (box) {
    const p = document.createElement('p');
    p.className = b.t; p.innerHTML = esc(b.s);
    box.appendChild(p); box.scrollTop = box.scrollHeight;
  }
  const BM = { big: ['fierce', 'pain'], near: ['proud', 'pain'], counter: ['fierce', 'pain'],
               brawl: ['rage', 'pain'], crowd: ['proud', null] };
  if (b.t === 'runin') { setMood('#fA', 'rage', P.look); setMood('#fB', 'rage', MV.opp.look); }
  else if (BM[b.t] && b.me !== undefined) {
    const act = b.me ? '#fA' : '#fB', tgt = b.me ? '#fB' : '#fA';
    const al = b.me ? P.look : MV.opp.look, tl = b.me ? MV.opp.look : P.look;
    if (BM[b.t][0]) setMood(act, BM[b.t][0], al);
    if (BM[b.t][1]) setMood(tgt, BM[b.t][1], tl);
  }
  const ring = document.querySelector('.ring');
  if (ring && (b.t === 'near' || b.t === 'big' || b.t === 'runin')) {
    ring.classList.add(b.t === 'runin' ? 'flash' : 'shake');
    setTimeout(() => ring.classList.remove('shake', 'flash'), 320);
  }
  if (b.me !== undefined) {
    MV.mom = cl(MV.mom + (b.me ? 1 : -1) * (b.t === 'big' ? 2 : 1), -6, 6);
    const pct = 50 + MV.mom * 7;
    const a = $('#hA'), bb = $('#hB');
    if (a) a.style.width = pct + '%';
    if (bb) bb.style.width = (100 - pct) + '%';
    const f = $(b.me ? '#fA' : '#fB');
    if (f) { f.classList.add(b.me ? 'lunge-l' : 'lunge-r'); setTimeout(() => f.classList.remove('lunge-l', 'lunge-r'), 200); }
  }
}

    '<button class="btn ' + (hasSave() ? '' : 'pri') + '" onclick="mode=\'create\';CR=null;render()">새 커리어</button>' +
    '</div>' +
    '<div class="pnl mini dim" style="margin-top:14px">링 위의 승패는 <b class="pk">부커</b>가 정합니다.<br>당신이 정하는 것은 <b class="gold">경기의 질</b>입니다.<br><br>훈련으로 능력치를 키우고, 좋은 경기로 팬을 얻고,<br>백스테이지의 신뢰를 쌓아 메인이벤터가 되십시오.</div></div>';
}
function resume() { if (load()) { mode = 'game'; tab = 'home'; render(); } else toast('저장 데이터를 읽을 수 없습니다.'); }

/* ---------- 캐릭터 생성 ---------- */
const AGES = [[18, '18세', '성장 잠재력 최대'], [22, '22세', '균형형'], [26, '26세', '초기 능력 우수']];
function renderCreate() {
  if (!CR) CR = { name: '', style: 'power', align: 'face', age: 18, look: randLook() };
  const inp = $('#nm'); if (inp) CR.name = inp.value;
  $('#hd').innerHTML = ''; $('#nv').innerHTML = '';
  let h = '<div class="fade"><div class="pnl center">' + spr(CR.look, 5) +
    '<div class="pk" style="margin-top:6px">' + esc(CR.name || '???') + '</div>' +
    '<div class="tiny dim">' + STYLES[CR.style].n + ' · ' + (CR.align === 'face' ? '페이스(선역)' : '힐(악역)') + ' · ' + CR.age + '세</div></div>';
  h += '<div class="pnl"><div class="ttl">링네임</div><input type="text" id="nm" maxlength="12" placeholder="예: 네온 스톰" value="' + esc(CR.name) + '"></div>';
  h += '<div class="pnl"><div class="ttl">파이팅 스타일</div>' +
    Object.keys(STYLES).map(k => '<button class="opt ' + (CR.style === k ? 'on' : '') + '" onclick="setCR(\'style\',\'' + k + '\')"><b>' + STYLES[k].n + '</b><span>' + STYLES[k].d + ' · ' +
      ATTRS.map(a => a.n + ' ' + STYLES[k].base[a.k]).join(' / ') + '</span></button>').join('') + '</div>';
  h += '<div class="pnl"><div class="ttl">캐릭터 성향</div><div class="btns g2">' +
    '<button class="btn sm ' + (CR.align === 'face' ? 'pri' : '') + '" onclick="setCR(\'align\',\'face\')">페이스(선역)</button>' +
    '<button class="btn sm ' + (CR.align === 'heel' ? 'pri' : '') + '" onclick="setCR(\'align\',\'heel\')">힐(악역)</button></div></div>';
  h += '<div class="pnl"><div class="ttl">데뷔 나이</div>' +
    AGES.map(a => '<button class="opt ' + (CR.age === a[0] ? 'on' : '') + '" onclick="setCR(\'age\',' + a[0] + ')"><b>' + a[1] + '</b><span>' + a[2] + '</span></button>').join('') + '</div>';
  const pi = CR.look.p || 0, ti = CR.look.t || 0;
  h += '<div class="pnl"><div class="row"><span class="ttl" style="margin:0">캐릭터</span>' +
    '<span class="tiny dim">프리셋 ' + (pi * TONES.length + ti + 1) + ' / ' + PRESETS + '</span></div>' +
    '<div class="btns g3" style="margin-top:8px">' +
    '<button class="btn sm" onclick="stepPreset(-1)">◀ 이전</button>' +
    '<button class="btn sm" onclick="rollLook()">🎲 랜덤</button>' +
    '<button class="btn sm" onclick="stepPreset(1)">다음 ▶</button></div>' +
    '<div class="pwrap"><div class="pgrid">' +
    Array.from({ length: NPORT }, (_, i) =>
      '<button class="pcard ' + (pi === i ? 'on' : '') + '" onclick="setLook(\'p\',' + i + ')">' +
      spr({ p: i, t: ti }, 3) + (FACEMAP[i] ? '<span class="fbadge">표정</span>' : '') + '</button>').join('') + '</div></div>' +
    '<div class="tiny dim" style="margin:-2px 0 8px">★ <b class="pk">표정</b> 배지가 붙은 캐릭터는 승리·분노·고통 시 실제 얼굴이 바뀝니다.</div>' +
    '<div class="mini">톤</div><div class="swatch">' +
    TONES.map((tn, i) => '<button class="btn sm ' + (ti === i ? 'pri' : '') +
      '" style="width:auto;padding:4px 9px;min-height:36px" onclick="setLook(\'t\',' + i + ')">' +
      tn.n + '</button>').join('') + '</div></div>';
  h += '<div class="btns g2" style="margin-bottom:20px"><button class="btn" onclick="mode=\'title\';render()">뒤로</button>' +
    '<button class="btn pri" onclick="startCareer()">데뷔하기</button></div></div>';
  $('#mn').innerHTML = h;
}
function setCR(k, v) { const i = $('#nm'); if (i) CR.name = i.value; CR[k] = v; renderCreate(); }
function stepPreset(d) {
  const i = $('#nm'); if (i) CR.name = i.value;
  const cur = (CR.look.p || 0) * TONES.length + (CR.look.t || 0);
  const nx = (cur + d + PRESETS) % PRESETS;
  CR.look = { p: Math.floor(nx / TONES.length), t: nx % TONES.length };
  renderCreate();
}
function rollLook() { const i = $('#nm'); if (i) CR.name = i.value; CR.look = randLook(); renderCreate(); }
function setLook(k, v) { const i = $('#nm'); if (i) CR.name = i.value; CR.look[k] = v; renderCreate(); }
function startCareer() {
  const i = $('#nm'); if (i) CR.name = i.value.trim();
  if (!CR.name) { toast('링네임을 입력하세요.'); return; }
  newGame(CR);
  mode = 'game'; tab = 'home'; S.phase = 'idle';
  closeModal(); render();
  showReport({ title: '데뷔', lines: [
    '<b class="gold">' + esc(P.name) + ', GWF NEXT 데뷔!</b>',
    'GWF NEXT와 1년 계약을 맺었습니다. 주급 $' + P.salary + '.',
    '<span class="dim">매주 활동을 선택하고 쇼에 출전해 인지도와 부커의 신뢰를 쌓으세요.</span>',
    '<span class="dim">목표: 월드 여성 챔피언 등극.</span>'] });
  S.phase = 'idle';
}

/* ---------- 명예의 전당(엔딩) ---------- */
function renderHOF() {
  $('#hd').innerHTML = ''; $('#nv').innerHTML = '';
  const avg = P.st.matches ? r1(P.st.stars / P.st.matches) : 0;
  $('#mn').innerHTML = '<div class="fade"><div class="logo"><h1 style="font-size:20px">CAREER END</h1><h2>' + esc(P.name) + '</h2></div>' +
    '<div class="center">' + spr(P.look, 5, '', '', 'sepia') + '</div>' +
    '<div class="pnl center"><div class="tiny dim">최종 평가</div>' +
    '<div class="gold" style="font-size:24px">' + S.hof + '</div>' +
    '<div class="pk">' + hofRank(S.hof) + '</div></div>' +
    '<div class="pnl"><div class="grid2">' +
    '<div class="stat"><b>' + P.rec.w + '-' + P.rec.l + '</b><span>통산 전적</span></div>' +
    '<div class="stat"><b>' + P.st.titles + '</b><span>타이틀</span></div>' +
    '<div class="stat"><b>★' + avg + '</b><span>평균 평점</span></div>' +
    '<div class="stat"><b>★' + P.st.best + '</b><span>최고 평점</span></div>' +
    '<div class="stat"><b>' + Math.round(P.st.peak) + '</b><span>최고 인지도</span></div>' +
    '<div class="stat"><b>' + Math.ceil(S.week / 52) + '년</b><span>활동 기간</span></div>' +
    '</div></div>' +
    '<button class="btn pri" onclick="wipe();mode=\'create\';CR=null;render()">새 커리어 시작</button>' +
    '<div style="height:24px"></div></div>';
}

/* ---------- 부팅 ---------- */
document.addEventListener('DOMContentLoaded', () => { mode = 'title'; render(); });
if (document.readyState !== 'loading') { mode = 'title'; render(); }
</script>
</body>
</html>
